# Self-hosted runners for frappe/press. On each VM:
#
#   apt-get install -y docker.io docker-compose-v2 docker-buildx
#   # copy this directory to the VM, then in it:
#   printf 'RUNNER_PREFIX=vm101\nRUNNER_TOKEN=<token>\n' > .env
#   docker compose up -d --build --scale runner=6
#
# Get the token from Settings > Actions > Runners > New self-hosted runner.
# It expires after 1 hour, but a runner needs it only when it registers. A
# container that compose recreates registers again and needs a new token.
#
# Each container runs one runner and its own dockerd, so jobs on one VM do not
# share port 3306, container names or /home/runner/frappe-bench.
services:
  runner:
    build: .
    privileged: true # needed to run dockerd inside the container
    restart: unless-stopped
    environment:
      RUNNER_URL: https://github.com/frappe/press
      RUNNER_PREFIX: ${RUNNER_PREFIX:?set RUNNER_PREFIX in .env, e.g. vm101}
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
    volumes:
      - /var/lib/docker # one anonymous volume per replica
