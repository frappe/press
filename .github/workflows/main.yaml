name: Press Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Check for Changes and Lint
    runs-on: ${{ vars.SELF_HOSTED_RUNNERS == 'true' && !github.event.pull_request.head.repo.fork && 'self-hosted' || 'ubuntu-latest' }}
    outputs:
      changed-python: ${{ steps.changed-python-files.outputs.any_changed }}
      changed-python-files: ${{ steps.changed-python-files.outputs.all_changed_files }}
      changed-build: ${{ steps.changed-build-files.outputs.any_changed }}
      changed-json: ${{ steps.changed-json-files.outputs.any_changed }}
      changed-js-vue: ${{ steps.changed-js-vue-files.outputs.any_changed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get changed python files
        id: changed-python-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            **.py

      - name: Get changed build files
        id: changed-build-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            pyproject.toml

      - name: Get changed json files
        id: changed-json-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            **.json

      - name: Get changed js or vue files
        id: changed-js-vue-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            **.js
            **.vue

      - name: Check for valid Python & Merge Conflicts
        run: |
          python -m compileall -q -f "${GITHUB_WORKSPACE}"
          if grep -lr --exclude-dir=node_modules "^<<<<<<< " "${GITHUB_WORKSPACE}"
              then echo "Found merge conflicts"
              exit 1
          fi

      - name: Set up Python
        if: steps.changed-python-files.outputs.any_changed == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.10.20'

      - name: Cache pip
        # Self-hosted runners share pip and yarn caches on the VM, so they skip GitHub's cache.
        if: steps.changed-python-files.outputs.any_changed == 'true' && runner.environment == 'github-hosted'
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*dev-requirements.txt, **/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Lint Check
        if: steps.changed-python-files.outputs.any_changed == 'true'
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-python-files.outputs.all_changed_files }}
        run: |
          pip install ruff
          ruff check --output-format github ${ALL_CHANGED_FILES}

  format:
    name: Format & Type Check
    runs-on: ${{ vars.SELF_HOSTED_RUNNERS == 'true' && !github.event.pull_request.head.repo.fork && 'self-hosted' || 'ubuntu-latest' }}
    needs: changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10.20'

      - name: Cache pip
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*dev-requirements.txt, **/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: List all changed files
        if: needs.changes.outputs.changed-python == 'true'
        env:
          ALL_CHANGED_FILES: ${{ needs.changes.outputs.changed-python-files }}
        run: |
          for file in ${ALL_CHANGED_FILES}; do
            echo "$file was changed"
          done

      - name: Format Check
        if: needs.changes.outputs.changed-python == 'true'
        env:
          ALL_CHANGED_FILES: ${{ needs.changes.outputs.changed-python-files }}
        run: |
          ruff format --check ${ALL_CHANGED_FILES} --diff

      - name: Typing Check
        if: needs.changes.outputs.changed-python == 'true'
        env:
          ALL_CHANGED_FILES: ${{ needs.changes.outputs.changed-python-files }}
        run: |
          # Exclude test files, matching the pre-commit mypy hook's exclude pattern.
          FILES=$(echo ${ALL_CHANGED_FILES} | tr ' ' '\n' | grep -vE '^tests/|test_.*\.py$' || true)
          if [ -n "$FILES" ]; then
            mypy $FILES
          else
            echo "No non-test Python files changed; skipping mypy."
          fi

  semgrep:
    name: Semgrep Rules
    runs-on: ${{ vars.SELF_HOSTED_RUNNERS == 'true' && !github.event.pull_request.head.repo.fork && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10.20'

      - name: Run Semgrep rules
        run: |
          pip install semgrep==1.32
          semgrep ci --config ./press-semgrep-rules.yml --config r/python.lang.correctness --baseline-commit "${{ github.base_ref || 'master' }}"

  install:
    name: Setup Bench
    # With the repository variable SELF_HOSTED_RUNNERS set to true, jobs use
    # the self-hosted runners in .github/runner/, except for fork PRs. Both
    # are Ubuntu 24.04, and every job that restores bench-dir uses this same
    # expression.
    runs-on: ${{ vars.SELF_HOSTED_RUNNERS == 'true' && !github.event.pull_request.head.repo.fork && 'self-hosted' || 'ubuntu-24.04' }}
    needs: changes
    if: needs.changes.outputs.changed-python == 'true' || needs.changes.outputs.changed-json == 'true' || needs.changes.outputs.changed-js-vue == 'true' || needs.changes.outputs.changed-build == 'true'

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=2s --health-retries=3
        volumes:
          - /data/mariadb_data:/var/lib/mysql

    steps:
      - name: Clone
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10.20'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true

      # The self-hosted runner image has these packages (.github/runner/Dockerfile).
      - name: Refresh apt index
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update

      - name: Cache apt
        if: runner.environment == 'github-hosted'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: redis-server libcups2-dev
          version: 1.0 # Arbitrary version to bust cache when needed

      - name: Cache pip
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*dev-requirements.txt, **/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "::set-output name=dir::$(yarn cache dir)"'

      - name: Cache yarn
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v6
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install
        # Self-hosted runners share the yarn cache. The lock lets one install
        # at a time write it, like sharing=locked in press/docker/Dockerfile.
        run: ${{ runner.environment == 'self-hosted' && 'flock /cache/yarn/.lock' || '' }} bash ${GITHUB_WORKSPACE}/.github/helper/install.sh

      - name: Cache bench directory
        if: runner.environment == 'github-hosted'
        uses: actions/cache/save@v6
        with:
          key: bench-dir-${{ github.run_id }}
          path: /home/runner/frappe-bench

      # All self-hosted runners are on one VM and share /cache (see
      # .github/runner/compose.yaml). A local copy is faster than an upload to
      # GitHub's cache. The Client and Server jobs mount it with overlayfs.
      - name: Save bench directory on the runner VM
        if: runner.environment == 'self-hosted'
        run: |
          rm -rf /cache/runs/${{ github.run_id }}
          mkdir -p /cache/runs/${{ github.run_id }}
          cp -a /home/runner/frappe-bench /cache/runs/${{ github.run_id }}/

      - name: Stop mariadb service
        run: |
          docker stop ${{ job.services.mariadb.id }}

      - name: Change ownership of mariadb data directory (for caching)
        run: |
          sudo chown -R runner:runner /data/mariadb_data

      - name: Cache mariadb data directory
        if: runner.environment == 'github-hosted'
        uses: actions/cache/save@v6
        with:
          key: mariadb-data-${{ github.run_id }}
          path: /data/mariadb_data

      - name: Save mariadb data directory on the runner VM
        if: runner.environment == 'self-hosted'
        run: cp -a /data/mariadb_data /cache/runs/${{ github.run_id }}/

  ui-tests:
    needs: [changes, install]
    name: Client
    # Playwright 1.54 cannot install Chromium on ubuntu-latest (26.04)
    runs-on: ${{ vars.SELF_HOSTED_RUNNERS == 'true' && !github.event.pull_request.head.repo.fork && 'self-hosted' || 'ubuntu-24.04' }}
    env:
      PRESS_ADMIN_USER_EMAIL: playwright@example.com
      PRESS_ADMIN_USER_PASSWORD: playwright
      BASE_URL: http://test_site:8000
    if: needs.changes.outputs.changed-python == 'true' || needs.changes.outputs.changed-json == 'true' || needs.changes.outputs.changed-js-vue == 'true' || needs.changes.outputs.changed-build == 'true'

    steps:
      - name: Create mariadb data directory
        run: |
          sudo mkdir -p /data/mariadb_data

      - name: Change ownership of mariadb data directory (for cache restore)
        run: |
          sudo chown -R runner:runner /data/mariadb_data

      - name: Restore mariadb data directory from cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@v6
        with:
          key: mariadb-data-${{ github.run_id }}
          path: /data/mariadb_data

      - name: Restore mariadb data directory from the runner VM
        if: runner.environment == 'self-hosted'
        run: cp -a /cache/runs/${{ github.run_id }}/mariadb_data/. /data/mariadb_data/

      - name: Change ownership of mariadb data directory (post cache restore)
        run: |
          sudo chown -R 999:systemd-journal /data/mariadb_data

      - name: Start mariadb service
        run: |
          docker run -d \
            --name mariadb \
            -e MYSQL_ROOT_PASSWORD=root \
            -p 3306:3306 \
            -v /data/mariadb_data:/var/lib/mysql \
            --health-cmd="mysqladmin ping" \
            --health-interval=5s \
            --health-timeout=2s \
            --health-retries=3 \
            mariadb:10.6

      - name: Clone
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10.20'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 18
          check-latest: true

      # The self-hosted runner image has these packages (.github/runner/Dockerfile).
      - name: Refresh apt index
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update

      - name: Cache apt
        if: runner.environment == 'github-hosted'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: redis-server libcups2-dev
          version: 1.0 # Arbitrary version to bust cache when needed

      - name: Restore bench directory from cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@v6
        with:
          path: /home/runner/frappe-bench
          key: bench-dir-${{ github.run_id }}

      - name: Mount bench directory from the runner VM
        if: runner.environment == 'self-hosted'
        run: bash ${GITHUB_WORKSPACE}/.github/helper/mount-bench.sh

      - name: Install Bench command
        run: pip install frappe-bench

      - name: Don't run unnecessary services
        working-directory: /home/runner/frappe-bench
        run: |
          sed -i 's/watch:/# watch:/g' Procfile
          sed -i 's/schedule:/# schedule:/g' Procfile
          sed -i 's/socketio:/# socketio:/g' Procfile
          sed -i 's/redis_socketio:/# redis_socketio:/g' Procfile

      - name: Start Bench
        working-directory: /home/runner/frappe-bench
        run: |
          bench start &> bench_start_logs.txt &

      - name: Add to Hosts
        run: |
          echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Install Playwright browsers
        working-directory: /home/runner/frappe-bench/apps/press/dashboard
        run: npx playwright install chromium

      - name: Setup Test Users
        working-directory: /home/runner/frappe-bench/apps/press/dashboard
        run: |
          bench --site test_site execute press.press.doctype.team.test_team.create_test_press_admin_team \
            --kwargs "{\"email\": \"${PRESS_ADMIN_USER_EMAIL}\", \"free_account\": True, \"skip_onboarding\": True}"
          bench --site test_site set-password "$PRESS_ADMIN_USER_EMAIL" "$PRESS_ADMIN_USER_PASSWORD"

      - name: Run Playwright Tests
        working-directory: /home/runner/frappe-bench/apps/press/dashboard
        run: npx playwright test --project=chromium

      - name: Generate Coverage Report
        working-directory: /home/runner/frappe-bench/apps/press/dashboard
        run: npx nyc report --reporter=cobertura --reporter=text --report-dir=./coverage

      - name: Upload Playwright Test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: /home/runner/frappe-bench/apps/press/dashboard/playwright-report

      - name: Upload coverage data
        uses: codecov/codecov-action@v7
        with:
          disable_search: true
          files: /home/runner/frappe-bench/apps/press/dashboard/coverage/cobertura-coverage.xml
          fail_ci_if_error: false
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
          name: press-dashboard
          flags: dashboard

      # The old cleanup.sh in the runner image cannot remove a mounted bench.
      - name: Unmount bench directory
        if: always() && runner.environment == 'self-hosted'
        run: if mountpoint -q /home/runner/frappe-bench; then sudo umount --lazy /home/runner/frappe-bench; fi

  server-tests:
    needs: [changes, install]
    name: Server
    runs-on: ${{ vars.SELF_HOSTED_RUNNERS == 'true' && !github.event.pull_request.head.repo.fork && 'self-hosted' || 'ubuntu-24.04' }} # Same as install, which builds bench-dir
    strategy:
      fail-fast: false
      matrix:
        container: [1, 2, 3]
    if: needs.changes.outputs.changed-python == 'true' || needs.changes.outputs.changed-json == 'true' || needs.changes.outputs.changed-build == 'true'

    steps:
      - name: Create mariadb data directory
        run: |
          sudo mkdir -p /data/mariadb_data

      - name: Change ownership of mariadb data directory (for cache restore)
        run: |
          sudo chown -R runner:runner /data/mariadb_data

      - name: Restore mariadb data directory from cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@v6
        with:
          key: mariadb-data-${{ github.run_id }}
          path: /data/mariadb_data

      - name: Restore mariadb data directory from the runner VM
        if: runner.environment == 'self-hosted'
        run: cp -a /cache/runs/${{ github.run_id }}/mariadb_data/. /data/mariadb_data/

      - name: Change ownership of mariadb data directory (post cache restore)
        run: |
          sudo chown -R 999:systemd-journal /data/mariadb_data

      - name: Start mariadb service
        run: |
          docker run -d \
            --name mariadb \
            -e MYSQL_ROOT_PASSWORD=root \
            -p 3306:3306 \
            -v /data/mariadb_data:/var/lib/mysql \
            --health-cmd="mysqladmin ping" \
            --health-interval=5s \
            --health-timeout=2s \
            --health-retries=3 \
            mariadb:10.6

      - name: Clone
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10.20'

      # The self-hosted runner image has these packages (.github/runner/Dockerfile).
      - name: Refresh apt index
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update

      - name: Cache apt
        if: runner.environment == 'github-hosted'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: redis-server libcups2-dev
          version: 1.0 # Arbitrary version to bust cache when needed

      - name: Restore bench directory from cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@v6
        with:
          path: /home/runner/frappe-bench
          key: bench-dir-${{ github.run_id }}

      - name: Mount bench directory from the runner VM
        if: runner.environment == 'self-hosted'
        run: bash ${GITHUB_WORKSPACE}/.github/helper/mount-bench.sh

      - name: Install Bench command
        run: pip install frappe-bench

      - name: Start Bench
        working-directory: /home/runner/frappe-bench
        run: |
          bench start &> bench_start_logs.txt &

      - name: Add to Hosts
        run: |
          echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-parallel-tests --app press --with-coverage --total-builds 3 --build-number ${{ matrix.container }}
        env:
          TYPE: server
          COVERAGE_RCFILE: /home/runner/frappe-bench/apps/press/.coveragerc

      - name: Upload coverage reports to Codecov
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.container }}
          path: /home/runner/frappe-bench/sites/coverage.xml
        if: always()

      - name: Upload bench start logs
        uses: actions/upload-artifact@v7
        with:
          name: bench-start-logs-${{ matrix.container }}
          path: /home/runner/frappe-bench/bench_start_logs.txt
        if: always()

      # The old cleanup.sh in the runner image cannot remove a mounted bench.
      - name: Unmount bench directory
        if: always() && runner.environment == 'self-hosted'
        run: if mountpoint -q /home/runner/frappe-bench; then sudo umount --lazy /home/runner/frappe-bench; fi

  coverage:
    name: Coverage Wrap Up
    needs: server-tests
    if: always()
    runs-on: ${{ vars.SELF_HOSTED_RUNNERS == 'true' && !github.event.pull_request.head.repo.fork && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - name: Clone
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Upload coverage data
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

  tests-pass:
    name: Tests Pass
    needs: [server-tests, ui-tests]
    if: always()
    runs-on: ${{ vars.SELF_HOSTED_RUNNERS == 'true' && !github.event.pull_request.head.repo.fork && 'self-hosted' || 'ubuntu-latest' }}
    permissions: {}
    steps:
      - name: Check test results
        run: |
          if [[ "${{ needs.server-tests.result }}" == "failure" || "${{ needs.server-tests.result }}" == "cancelled" ]]; then
            echo "server-tests failed or were cancelled"
            exit 1
          fi
          if [[ "${{ needs.ui-tests.result }}" == "failure" || "${{ needs.ui-tests.result }}" == "cancelled" ]]; then
            echo "ui-tests failed or were cancelled"
            exit 1
          fi
          echo "All tests passed or were skipped"
