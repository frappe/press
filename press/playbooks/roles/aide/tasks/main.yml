---
- name: Install AIDE
  package:
    name:
      - aide
      - aide-common
    state: present
  register: apt_result
  until: apt_result.failed == false
  retries: 5
  delay: 120

- name: Update AIDE config to speed it up
  copy:
    src: 99_aide_root.j2
    dest: /etc/aide/aide.conf.d/99_aide_root
    owner: root
    group: root
    mode: 0644
    backup: yes

- name: Ensure AIDE is started
  shell: aideinit -y --force
  args:
      creates: /var/lib/aide/aide.db
  changed_when: no
  failed_when: no
