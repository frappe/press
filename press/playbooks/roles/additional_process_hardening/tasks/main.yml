---
- name: Ensure address space layout randomization (ASLR) is enabled
  sysctl:
    name: kernel.randomize_va_space
    value: '2'
    state: present
    reload: yes
    sysctl_set: yes
    ignoreerrors: yes

- name: Ensure prelink is disabled
  package:
    name: prelink
    state: absent
  register: apt_result
  until: apt_result.failed == false
  retries: 5
  delay: 120
