---
# No `htpasswd -c`: it truncates the file and drops the customer's scrape user
- name: Create Monitoring Password File
  become: yes
  become_user: frappe
  file:
    path: /home/frappe/agent/nginx/monitoring.htpasswd
    state: touch
    modification_time: preserve
    access_time: preserve

- name: Setup Monitoring Authentication
  become: yes
  become_user: frappe
  command: "htpasswd -Bb /home/frappe/agent/nginx/monitoring.htpasswd {{ monitoring_username | default('frappe') | quote }} {{ monitoring_password | quote }}"
