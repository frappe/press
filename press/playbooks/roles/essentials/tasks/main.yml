---
- name: Update APT Cache
  apt:
    update_cache: yes

- name: Install Essential Packages
  apt:
    state: present
    force: yes
    pkg:
      - build-essential
      - git
      - htop
      - libcrypto++-dev
      - libssl-dev
      - "{{ 'ntpsec' if ansible_distribution_version is version('26.04', '>=') else 'ntp' }}"
      - python3-dev
      - python3-pip
      - virtualenv
      - redis-server
      - screen
      - supervisor
      - vim
      - acl
      - zlib1g-dev
