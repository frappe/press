---
- name: Update APT Cache
  apt:
    update_cache: yes
  register: apt_result
  until: apt_result.failed == false
  retries: 5
  delay: 120

- name: Install Essential Packages
  apt:
    state: present
    force: yes
    pkg:
      - build-essential
      - git
      - htop
      - libcrypto++-dev
      - libssl-dev
      - ntp
      - python3-dev
      - python3-pip
      - virtualenv
      - redis-server
      - screen
      - supervisor
      - vim
      - acl
      - zlib1g-dev
  register: apt_result
  until: apt_result.failed == false
  retries: 5
  delay: 120
