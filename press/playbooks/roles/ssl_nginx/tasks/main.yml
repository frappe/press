---
- name: Update APT Cache
  apt:
    update_cache: yes
  register: apt_result
  until: apt_result.failed == false
  retries: 5
  delay: 120

- name: Install NGINX
  apt:
    pkg:
      - nginx
      - nginx-extras
      - apache2-utils
      - libpcre3-dev
    state: present
  register: apt_result
  until: apt_result.failed == false
  retries: 5
  delay: 120

- name: Add SSL Proxy for TLS
  template:
    src: ssl.conf
    dest: /etc/nginx/conf.d/ssl.conf
    mode: 0644

- name: Restart NGINX and Enable at Boot
  service:
    name: nginx
    state: restarted
