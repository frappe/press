---
- name: Create Benches Directory
  become: yes
  become_user: frappe
  file:
    dest: /home/frappe/benches
    state: directory

- name: Install MariaDB Client
  apt:
    pkg:
      - mariadb-client
    state: present
  register: apt_result
  until: apt_result.failed == false
  retries: 5
  delay: 120
