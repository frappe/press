[sshd]
enabled           = true
port              = {{ ansible_port | default(22) }}
mode              = aggressive
maxretry          = {{ fail2ban_maxretry }}
findtime          = {{ fail2ban_findtime }}
bantime           = {{ fail2ban_bantime }}
bantime.increment = true
ignoreip          = 127.0.0.1/8 ::1 {{ fail2ban_ignore_ips }}
