line-length = 110
indent-width = 4
# Left at py310 rather than matching requires-python (>=3.14). Raising it turns
# on py311+ upgrade rules across the whole tree (66 new findings: TC001-3 and
# UP017/042/043/046/047), which is a large refactor unrelated to the datetime
# work. Do it as its own change, once there is appetite for the churn.
target-version = "py310"

[format]
quote-style = "double"
indent-style = "tab"


[lint]
select = [
  "F",
  "E",
  "W",
  "I",
  "UP",
  "B",
  "RUF",
  "FA",
  "TCH",
  "C90",
  "RET",
  "SIM",
  # `datetime.utcnow()` is removed in Python 3.15, so this is a build failure
  # waiting for a version bump rather than a style preference. Scoped to DTZ003
  # alone: the rest of the datetimez ruleset flags naive local times that are
  # correct all over this codebase, and adopting it wholesale would bury the
  # one rule that matters.
  "DTZ003",
]
ignore = [
  "UP015",  # Unnecessary open mode parameters
  "SIM108", # Use ternary operator {contents} instead of if-else-block
  "F821",   # Undefined name, cause of DF.Literal
  "F722",   # syntax error in forward type annotation, cause of DF.Literal
  "E501",   # line too long, cause hooks.py
  "W191",   # indentation contains tabs, cause when the world zigs, we zag
  "B023",   # function doesn't bind loop variable - will have last iteration's value
  "UP037",  # remove quotes from annotations, messes up DF.Literal typing
  "SIM103", # return condition directly, readability suffers at times
]


[lint.mccabe]
max-complexity = 8
[lint.per-file-ignores]
"**/test_*.py" = ["C901"]  # ignore too complex in tests
