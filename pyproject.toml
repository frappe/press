[build-system]
requires = ["setuptools~=81.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "press"
dynamic = ["version"]
description = "Managed Frappe Hosting"
authors = [
    {name = "Frappe", email = "aditya@erpnext.com"}
]
readme = "README.md"
license = {text = "AGPL-3.0"}
# Frappe 16 requires >=3.14,<3.15, so the previous floor of 3.10 understated what
# actually installs. No upper bound: that is a statement about which Frappe
# version to target, and v16 is a floor rather than a ceiling.
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # 3.4.0 (2020) cannot be imported on Python 3.14. 2.18 is the newest core whose
    # TaskExecutor._poll_async_result still takes a plain result dict, which is the
    # signature press/runner.py monkey-patches.
    "ansible-core>=2.18,<2.19",
    "beautifulsoup4",
    "boto3==1.39.14",
    "certifi>=2026.10.19",
    "Click",
    "coverage",
    "dnspython==1.16.0",
    "docker>=7.1.0,<8.0.0",
    "dockerfile==3.2.0",
    "oci>=2.187.0,<3.0.0",
    "paramiko>=3.5.0,<4.0.0",
    "pexpect==4.8.0",
    "posthog==3.0.1",
    "prometheus-client==0.19.0",
    "PyGithub==1.44.1",
    "pyOpenSSL~=26.4.0",
    # v20+ is async and dropped the `imghdr` import that Python 3.13 removed.
    "python-telegram-bot>=21.0,<22.0",
    "razorpay>=1.3.0",
    # Frappe owns this version: 16 requires requests~=2.33.2, 17 requires
    # requests~=2.34.2. Pinning press to one of those series makes it
    # uninstallable on the other, since the two ranges do not overlap. Accept
    # either and let frappe's floor decide.
    "requests>=2.32,<3.0",
    "responses==0.23.1",
    "selenium==4.23.1",
    "semantic-version==2.10.0",
    "sql_metadata>=3.0.1",
    "stripe>=11.0.0,<12.0.0",
    "tldextract==3.4.4",
    "tomli==2.0.1",
    "tqdm==4.66.3",
    "twilio==8.10.3",
    "wrapt~=1.15.0",
    "elasticsearch-dsl>=8.0.0,<9.0.0",
    "hcloud==2.26.0",
    "playwright==1.55.0",
    "prometheus-api-client==0.6.0",
    "pydo==0.24.0",
    "setuptools~=81.0",
]

[project.optional-dependencies]
# The MCP endpoint is opt-in (Press Settings.enable_mcp). It is kept out of the
# required dependencies because frappe-mcp pins pydantic<2.12, whose
# pydantic-core has no Python 3.14 build -- and Frappe 16 requires Python 3.14.
# Install with `pip install -e .[mcp]` on a Python that can build it.
mcp = [
    "frappe-mcp @ git+https://github.com/frappe/mcp",
]
# Semgrep is only ever invoked as a CLI subprocess by the marketplace app audit,
# never imported, and semgrep requires urllib3>=2 which collides with the urllib3<2
# pin that python-telegram-bot 13.15 needs. The audit prefers a dedicated bench via
# `Marketplace Settings -> audit_bench_path` and already reports a clear
# `semgrep_unavailable` result when no binary is found, so this stays optional.
audit = [
    "semgrep==1.159.0",
]
dev = [
    "pre-commit",
    "ruff==0.14.2",
    "mypy==1.18.2",
    "ipdb==0.13.13",
    # typechecking
    "types-requests>=2.32,<3.0",
    "types-pytz~=2025.2",
    "types-python-dateutil~=2.9.0",
    "types-boto3==1.39.14",
    "types-jwt==0.1.3",
    "types-setuptools~=81.0",
    "types-stripe>=11,<12",
    "types-oauthlib~=3.3",
    "types-passlib~=1.7",
]

[project.scripts]
backbone = "backbone.cli:cli"

[tool.setuptools]
packages = ["press"]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "press.__version__"}

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"

[tool.bench.dev-dependencies]
cryptography = "~=50.0.0" # must stay in step with the framework and with pyOpenSSL; the old ~=45 cap only existed to prop up pyOpenSSL 23
"moto[all]" = "~=5.0"
Werkzeug = "==3.1.6" # has to be manually kept same as framework since moto has a loose dependency
Faker = "==23.2.0"
freezegun = "==1.2.2"
